name: Signed Windows release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Validate release version
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm test
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Generate release notes
        run: gh api "repos/${{ github.repository }}/releases/generate-notes" -f "tag_name=${{ github.ref_name }}" --jq .body > release-notes.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build signed installer and update manifest
        run: npm run package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_NOTES_FILE: release-notes.txt
      - name: Verify signed release and reject tampered installer
        run: cargo test --manifest-path src-tauri/Cargo.toml signed_release_matches_embedded_key_and_rejects_tampering -- --ignored
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: IdeaGitTool-${{ github.ref_name }}-windows-x64
          path: release/*
          if-no-files-found: error
      - name: Create release draft
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES_FILE: release-notes.txt
