name: Signed Windows release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Select versioned release notes
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "RELEASE_NOTES_FILE=docs/RELEASE_${version}.md" >> "$GITHUB_ENV"
      - name: Validate release version and notes
        run: node scripts/check-release.mjs
      - name: Validate release publishing plan
        run: node --test scripts/release-plan.test.mjs
      - name: Check updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.IDEA_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '::error::Configure TAURI_SIGNING_PRIVATE_KEY or IDEA_KEY with the existing updater private key before publishing.'
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build signed installer and update manifest
        run: npm run package
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY || secrets.IDEA_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify signed release and reject tampered installer
        run: cargo test --manifest-path src-tauri/Cargo.toml signed_release_matches_embedded_key_and_rejects_tampering -- --ignored
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: IdeaGitTool-${{ github.ref_name }}-windows-x64
          path: release/*
          if-no-files-found: error
      - name: Publish verified release
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
