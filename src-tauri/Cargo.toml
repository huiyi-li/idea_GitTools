[package]
name = "ideagittool-desktop"
version = "0.4.3"
description = "Lightweight standalone IdeaGitTool Git client"
authors = ["IdeaGitTool contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.91"

[lib]
name = "ideagittool_desktop"
crate-type = ["rlib"]

[[bin]]
name = "ideagittool-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tempfile = "3"
notify = "8"
reqwest = { version = "0.12", features = ["json"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "net", "rt-multi-thread", "macros"] }
tauri-plugin-updater = "2"

[dev-dependencies]
minisign-verify = "0.3"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
