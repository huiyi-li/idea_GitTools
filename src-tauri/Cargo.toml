[package]
name = "ideagittool-desktop"
version = "0.1.0"
description = "Lightweight standalone IdeaGitTool Git client"
authors = ["IdeaGitTool contributors"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.91"

[lib]
name = "ideagittool_desktop"
crate-type = ["rlib"]

[[bin]]
name = "ideagittool-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
notify = "8"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
